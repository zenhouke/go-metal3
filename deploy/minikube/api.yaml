apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-metal3-api
  namespace: baremetal-operator-system
  labels:
    app.kubernetes.io/name: go-metal3-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-metal3-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-metal3-api
    spec:
      serviceAccountName: go-metal3-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: go-metal3-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: go-metal3-runtime
          env:
            - name: API_KEY_FILE
              value: /run/secrets/api/api-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: api-secrets
              mountPath: /run/secrets/api
              readOnly: true
      volumes:
        - name: api-secrets
          secret:
            secretName: go-metal3-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: go-metal3-api
  namespace: baremetal-operator-system
spec:
  selector:
    app.kubernetes.io/name: go-metal3-api
  ports:
    - name: http
      port: 8080
      targetPort: http
