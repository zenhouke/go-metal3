apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-metal3-sdk
  namespace: metal3
rules:
  - apiGroups: ["metal3.io"]
    resources: ["baremetalhosts"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["metal3.io"]
    resources: ["hardwaredata"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metal3.io"]
    resources: ["hostfirmwaresettings", "hostfirmwarecomponents"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["metal3.io"]
    resources: ["firmwareschemas", "preprovisioningimages"]
    verbs: ["get"]
  - apiGroups: ["metal3.io"]
    resources: ["bmceventsubscriptions", "dataimages", "hostclaims", "hostdeploypolicies", "hostupdatepolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
